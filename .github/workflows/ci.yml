name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck hooks/*.sh tests/*.sh skills/*/*.sh

      - name: hook tests (dash)
        run: sh tests/hook_test.sh

      - name: hook tests (bash)
        run: HOOK_SHELL=bash bash tests/hook_test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: validate plugin
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
